<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Ebooks Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <h1 class="logo">ANIME<span>BOOKS</span></h1>
            <ul class="nav-links">
                <li class="nav-item active" data-section="home">Home</li>
                <li class="nav-item" data-section="trending">Trending</li>
                <li class="nav-item" data-section="new">New Released</li>
                <li class="nav-item" data-section="all">All Anime</li>
            </ul>
        </div>
        <div class="nav-right">
            <select id="langSelect" class="lang-select">
                <option value="en">English</option>
                <option value="tl">Tagalog</option>
            </select>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search anime ebooks...">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </nav>

    <!-- HERO BANNER -->
    <section class="hero">
        <div class="hero-content">
            <h2 id="heroTitle">Your Favorite Anime Novels & Manga</h2>
            <p id="heroDesc">Download thousands of anime light novels, manga, and ebooks for free</p>
        </div>
    </section>

    <!-- CONTENT SECTIONS -->
    <div class="container">
        <section class="section">
            <div class="section-header">
                <h2 id="trendingTitle">🔥 Trending Now</h2>
            </div>
            <div class="card-row" id="trendingRow"></div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2 id="newTitle">✨ New Released</h2>
            </div>
            <div class="card-row" id="newRow"></div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2 id="allTitle">📚 All Anime Ebooks</h2>
            </div>
            <div class="card-row" id="allRow"></div>
        </section>
    </div>

    <!-- INFO MODAL -->
    <div id="infoModal" class="modal">
        <span class="close-btn">&times;</span>
        <div class="modal-content">
            <div class="modal-left">
                <img id="modalImg" src="" alt="">
            </div>
            <div class="modal-right">
                <h2 id="modalTitle"></h2>
                <div class="meta">
                    <span id="modalYear"></span> • 
                    <span id="modalType"></span> • 
                    <span id="modalLang"></span>
                </div>
                <p id="modalDesc"></p>
                <button id="downloadBtn" class="download-btn">
                    <i class="fas fa-download"></i> Download Ebook
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
